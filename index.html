document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

screen=\"\" style=\"display:none;position:fixed;inset:0;z-index:9998;background:#f4f1ea;align-items:center;justify-content:center;font-family:Archivo,Helvetica,Arial,sans-serif\">\n    <div style=\"width:340px;border:1.5px solid #000;background:#fff;padding:26px 24px\">\n      <div style=\"font-size:7.5pt;text-transform:uppercase;letter-spacing:0.22em;color:#8a8a8a\">GA Technical<\u002Fdiv>\n      <h2 style=\"font-size:18pt;font-weight:700;margin:4px 0 0 0;letter-spacing:-0.02em\">K10 specification<\u002Fh2>\n      <p data-lock-copy=\"\" style=\"font-size:9pt;color:#555;margin:10px 0 16px 0;line-height:1.5\">Enter your passcode to unlock.<\u002Fp>\n      <input data-lock-pass=\"\" type=\"password\" placeholder=\"Passcode\" style=\"font:400 11pt/1.2 Archivo,Helvetica,Arial,sans-serif;border:1px solid #000;padding:10px;width:100%;box-sizing:border-box\">\n      <input data-lock-pass2=\"\" type=\"password\" placeholder=\"Repeat passcode\" style=\"display:none;font:400 11pt/1.2 Archivo,Helvetica,Arial,sans-serif;border:1px solid #000;padding:10px;width:100%;box-sizing:border-box;margin-top:8px\">\n      <button data-lock-go=\"\" type=\"button\" style=\"appearance:none;border:1px solid #000;background:#000;color:#fff;font:600 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;padding:11px 14px;cursor:pointer;width:100%;margin-top:12px\">Unlock<\u002Fbutton>\n      <div data-lock-error=\"\" style=\"font-size:8.5pt;color:#b00;margin-top:10px;min-height:1.2em\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-cloud-bar=\"\" style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #000;background:#f6f4ef;padding:10px 12px;margin:12px 0 4px 0\">\n    <div style=\"font-size:7.5pt;text-transform:uppercase;letter-spacing:0.18em;color:#000;font-weight:600\">Cloud<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n      <sc-raw-select data-cloud-list=\"\" style=\"font:400 9pt/1.2 Archivo,Helvetica,Arial,sans-serif;border:1px solid #000;padding:7px 8px;min-width:240px;background:#fff\"><\u002Fsc-raw-select>\n      <button data-cloud-open=\"\" type=\"button\" style=\"appearance:none;border:1px solid #000;background:#fff;color:#000;font:600 9pt/1.2 Archivo,Helvetica,Arial,sans-serif;padding:8px 12px;cursor:pointer\">Open<\u002Fbutton>\n      <button data-cloud-new=\"\" type=\"button\" style=\"appearance:none;border:1px solid #000;background:#000;color:#fff;font:600 9pt/1.2 Archivo,Helvetica,Arial,sans-serif;padding:8px 12px;cursor:pointer\">New K10<\u002Fbutton>\n    <\u002Fdiv>\n    <div data-cloud-status=\"\" style=\"font-size:8.5pt;color:#555;margin-left:auto\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"font-size:9pt;margin:6px 0 16px 0;color:#555;max-width:90ch\">Fill this out, then press <strong>Apply to specification<\u002Fstrong> — it builds tab 2 (front page) and tab 3 (K10) from these details and takes you there. This tab is never printed; printing outputs the front page followed by the K10.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:1fr;gap:26px\">\n    <div>\n      <div style=\"background:#000;color:#fff;padding:4px 8px;font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:0.1em\">Project information<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px\">\n        <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Specification title\n          <input data-setup=\"specBrand\" type=\"text\" placeholder=\"GA Technical Specification\" style=\"border:1px solid #000;padding:6px 7px;font:400 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;color:#000;background:#fff;text-transform:none;letter-spacing:0\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Issuing company\n          <input data-setup=\"companyName\" type=\"text\" placeholder=\"GA Interiors Ltd.\" style=\"border:1px solid #000;padding:6px 7px;font:400 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;color:#000;background:#fff;text-transform:none;letter-spacing:0\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Project number\n          <input data-setup=\"projectNumber\" type=\"text\" placeholder=\"BPD000000\" style=\"border:1px solid #000;padding:6px 7px;font:400 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;color:#000;background:#fff;text-transform:none;letter-spacing:0\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Revision\n          <input data-setup=\"revision\" type=\"text\" placeholder=\"A\" style=\"border:1px solid #000;padding:6px 7px;font:400 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;color:#000;background:#fff;text-transform:none;letter-spacing:0\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Project name\n          <input data-setup=\"projectName\" type=\"text\" placeholder=\"[Project name]\" style=\"border:1px solid #000;padding:6px 7px;font:400 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;color:#000;background:#fff;text-transform:none;letter-spacing:0\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Date of issue\n          <input data-setup=\"issueDate\" type=\"text\" placeholder=\"DD.MM.YYYY\" style=\"border:1px solid #000;padding:6px 7px;font:400 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;color:#000;background:#fff;text-transform:none;letter-spacing:0\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.12em;color:#555;grid-column:1 / -1\">Address\n          <input data-setup=\"projectAddress\" type=\"text\" placeholder=\"[Street, Town, Postcode]\" style=\"border:1px solid #000;padding:6px 7px;font:400 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;color:#000;background:#fff;text-transform:none;letter-spacing:0\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Main contractor\n          <input data-setup=\"mainContractor\" type=\"text\" placeholder=\"[Main contractor]\" style=\"border:1px solid #000;padding:6px 7px;font:400 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;color:#000;background:#fff;text-transform:none;letter-spacing:0\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Drylining sub-contractor\n          <input data-setup=\"subContractor\" type=\"text\" placeholder=\"GA Interiors Ltd\" style=\"border:1px solid #000;padding:6px 7px;font:400 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;color:#000;background:#fff;text-transform:none;letter-spacing:0\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Architect\n          <input data-setup=\"architect\" type=\"text\" placeholder=\"[Architect / practice name]\" style=\"border:1px solid #000;padding:6px 7px;font:400 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;color:#000;background:#fff;text-transform:none;letter-spacing:0\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Issued by\n          <input data-setup=\"issuedBy\" type=\"text\" placeholder=\"Samuel Dann — Head of Design &amp; Technical\" style=\"border:1px solid #000;padding:6px 7px;font:400 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;color:#000;background:#fff;text-transform:none;letter-spacing:0\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Contact tel\n          <input data-setup=\"issuedByTel\" type=\"text\" placeholder=\"07594 131593\" style=\"border:1px solid #000;padding:6px 7px;font:400 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;color:#000;background:#fff;text-transform:none;letter-spacing:0\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Contact email\n          <input data-setup=\"issuedByEmail\" type=\"text\" placeholder=\"samuel@gainteriorsltd.com\" style=\"border:1px solid #000;padding:6px 7px;font:400 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;color:#000;background:#fff;text-transform:none;letter-spacing:0\">\n        <\u002Flabel>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;margin-top:12px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ applySetup }}\" style=\"appearance:none;border:1px solid #000;background:#000;color:#fff;font:600 9pt/1.2 Archivo,Helvetica,Arial,sans-serif;padding:9px 13px;cursor:pointer\" style-hover=\"background:#333;border-color:#333\">Apply to specification<\u002Fbutton>\n        <span style=\"font-size:7.5pt;line-height:1.4;color:#8a8a8a\">{{ setupStatus }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"background:#000;color:#fff;padding:4px 8px;font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:0.1em\">Manufacturer &amp; system library<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px\">\n        <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Manufacturer\n          <sc-raw-select data-setup=\"manufacturer\" style=\"border:1px solid #000;padding:6px 7px;font:400 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;color:#000;background:#fff;text-transform:none;letter-spacing:0\">\n            <option value=\"British Gypsum\">British Gypsum<\u002Foption>\n            <option value=\"Siniat\">Siniat<\u002Foption>\n            <option value=\"Knauf\">Knauf<\u002Foption>\n            <option value=\"Hadley\">Hadley<\u002Foption>\n            <option value=\"\">Other — type below<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7.5pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Board range / other\n          <input data-setup=\"boardRange\" type=\"text\" placeholder=\"GTEC / Gyproc / Performance\" style=\"border:1px solid #000;padding:6px 7px;font:400 10pt/1.2 Archivo,Helvetica,Arial,sans-serif;color:#000;background:#fff;text-transform:none;letter-spacing:0\">\n        <\u002Flabel>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #000;padding:9px 10px;margin-top:14px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n          <div style=\"font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:0.1em\">Choose a system from the library<\u002Fdiv>\n          <div style=\"font-size:7.5pt;color:#8a8a8a\">{{ catalogCount }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px\">\n          <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Schedule\n            <sc-raw-select data-pick=\"kind\" sc-camel-on-change=\"{{ onPick }}\" style=\"border:1px solid #000;padding:6px 7px;font:400 9.5pt/1.2 Archivo,Helvetica,Arial,sans-serif;background:#fff\">\n              <option value=\"wall\">Drylining / partitions<\u002Foption>\n              <option value=\"ceiling\">Ceilings<\u002Foption>\n              <option value=\"steel\">Steel encasement<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">System family\n            <sc-raw-select data-pick=\"family\" sc-camel-on-change=\"{{ onPick }}\" style=\"border:1px solid #000;padding:6px 7px;font:400 9.5pt/1.2 Archivo,Helvetica,Arial,sans-serif;background:#fff\">\n              <option value=\"\">All families<\u002Foption>\n              <sc-for list=\"{{ familyOptions }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                <option value=\"{{ opt.value }}\">{{ opt.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Project reference\n            <input data-pick=\"projectRef\" type=\"text\" placeholder=\"[XX-000]\" style=\"border:1px solid #000;padding:6px 7px;font:400 9pt/1.2 'IBM Plex Mono',monospace;background:#fff\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Fire resistance\n            <sc-raw-select data-pick=\"fire\" sc-camel-on-change=\"{{ onPick }}\" style=\"border:1px solid #000;padding:6px 7px;font:400 9.5pt/1.2 Archivo,Helvetica,Arial,sans-serif;background:#fff\">\n              <option value=\"\">Any / not published<\u002Foption>\n              <sc-for list=\"{{ fireOptions }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                <option value=\"{{ opt.value }}\">{{ opt.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Board type\n            <sc-raw-select data-pick=\"board\" sc-camel-on-change=\"{{ onPick }}\" style=\"border:1px solid #000;padding:6px 7px;font:400 9.5pt/1.2 Archivo,Helvetica,Arial,sans-serif;background:#fff\">\n              <option value=\"\">All boards<\u002Foption>\n              <sc-for list=\"{{ boardOptions }}\" as=\"opt\" hint-placeholder-count=\"5\">\n                <option value=\"{{ opt.value }}\">{{ opt.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <sc-if value=\"{{ showAcoustic }}\" hint-placeholder-val=\"{{ true }}\">\n            <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Acoustic — minimum\n              <sc-raw-select data-pick=\"acoustic\" sc-camel-on-change=\"{{ onPick }}\" style=\"border:1px solid #000;padding:6px 7px;font:400 9.5pt/1.2 Archivo,Helvetica,Arial,sans-serif;background:#fff\">\n                <option value=\"\">Any / not published<\u002Foption>\n                <sc-for list=\"{{ acousticOptions }}\" as=\"opt\" hint-placeholder-count=\"5\">\n                  <option value=\"{{ opt.value }}\">{{ opt.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showHeight }}\" hint-placeholder-val=\"{{ true }}\">\n            <label style=\"display:flex;flex-direction:column;gap:3px;font-size:7pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Maximum height — minimum\n              <sc-raw-select data-pick=\"height\" sc-camel-on-change=\"{{ onPick }}\" style=\"border:1px solid #000;padding:6px 7px;font:400 9.5pt/1.2 Archivo,Helvetica,Arial,sans-serif;background:#fff\">\n                <option value=\"\">Any / not published<\u002Foption>\n                <sc-for list=\"{{ heightOptions }}\" as=\"opt\" hint-placeholder-count=\"5\">\n                  <option value=\"{{ opt.value }}\">{{ opt.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n          <\u002Fsc-if>\n          <label style=\"grid-column:1 / -1;display:flex;flex-direction:column;gap:3px;font-size:7pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">Keyword search — optional\n            <input data-pick=\"query\" type=\"text\" placeholder=\"SoundBloc, shaftwall, 146mm…\" sc-camel-on-input=\"{{ onPick }}\" style=\"border:1px solid #000;padding:6px 7px;font:400 9pt/1.2 Archivo,Helvetica,Arial,sans-serif;background:#fff\">\n          <\u002Flabel>\n          <label style=\"grid-column:1 / -1;display:flex;flex-direction:column;gap:3px;font-size:7pt;text-transform:uppercase;letter-spacing:0.12em;color:#555\">System — {{ matchCount }}\n            <sc-raw-select data-pick=\"id\" sc-camel-on-change=\"{{ onPick }}\" size=\"12\" style=\"border:1px solid #000;padding:4px;font:400 9pt/1.5 'IBM Plex Mono',monospace;background:#fff;white-space:pre\">\n              <sc-for list=\"{{ pickOptions }}\" as=\"opt\" hint-placeholder-count=\"6\">\n                <option value=\"{{ opt.value }}\">{{ opt.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"margin-top:8px;min-height:5.4em;border-top:1px solid #ddd\">\n          <sc-for list=\"{{ pickRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid;grid-template-columns:118px 1fr;gap:10px;padding:3px 0;border-bottom:1px solid #eee;font-size:8pt;line-height:1.4\">\n              <div style=\"text-transform:uppercase;letter-spacing:0.1em;font-size:7pt;color:#777;padding-top:1px\">{{ row.labe ;padding:3px 7px 3px 0;border-bottom:0.75px solid #ccc\">Plasterboard lining<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;border-bottom:0.75px solid #ccc\"><span class=\"fill\">[0 x 00mm<\u002Fspan> {{ manufacturer }} {{ boardRange }} <span class=\"fill\">board type, each side / room side]<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:3px 7px 3px 0;border-bottom:0.75px solid #ccc\">Horizontal joints<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;border-bottom:0.75px solid #ccc\"><span class=\"fill\">[Support method]<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:3px 7px 3px 0;\">Fixings<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;\"><span class=\"fill\">[Screw sizes and centres, clause reference]<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n\n        <div style=\"background:#000;color:#fff;padding:3px 7px;font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;break-after:avoid;break-inside:avoid\">Insulation<\u002Fdiv>\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;margin-bottom:12px;break-inside:avoid\">\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"width:38%;padding:3px 7px 3px 0;\">Cavity insulation type<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;\"><span class=\"fill\">[Thickness, product and fixing method — or \"No insulation required\"]<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n\n        <div style=\"background:#000;color:#fff;padding:3px 7px;font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;break-after:avoid;break-inside:avoid\">Finishing<\u002Fdiv>\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;break-inside:avoid\">\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"width:38%;padding:3px 7px 3px 0;border-bottom:0.75px solid #ccc\">Board finishing<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;border-bottom:0.75px solid #ccc\"><span class=\"fill\">[Taped and jointed / skimmed]<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:3px 7px 3px 0;border-bottom:0.75px solid #ccc\">Primer / sealer<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;border-bottom:0.75px solid #ccc\"><span class=\"fill\">[Refer to general clause 000]<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:3px 7px 3px 0;border-bottom:0.75px solid #ccc\">Sealant<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;border-bottom:0.75px solid #ccc\"><span class=\"fill\">[Sealant requirement]<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:3px 7px 3px 0;\">Beads<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;\"><span class=\"fill\">[Bead type and locations]<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n\n        <div style=\"background:#000;color:#fff;padding:3px 7px;font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;break-after:avoid;break-inside:avoid\">General notes<\u002Fdiv>\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;margin-top:0;break-inside:avoid\">\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"width:38%;padding:3px 7px 3px 0;vertical-align:top;border-bottom:0.75px solid #ccc\">Fixtures<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;vertical-align:top;border-bottom:0.75px solid #ccc\">Plywood pattresses fitted between studs to accommodate any heavy wall-mounted fixtures, dependent on load.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"width:38%;padding:3px 7px 3px 0;vertical-align:top;border-bottom:0.75px solid #ccc\">Flanking paths<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;vertical-align:top;border-bottom:0.75px solid #ccc\">Greater care required at corners, T-junctions and abutments to reduce flanking paths. Refer to the specification detailing.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"width:38%;padding:3px 7px 3px 0;vertical-align:top;border-bottom:0.75px solid #ccc\">Sockets and switches<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;vertical-align:top;border-bottom:0.75px solid #ccc\">Fire and acoustically stopped using putty pads or equal and approved.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"width:38%;padding:3px 7px 3px 0;vertical-align:top;border-bottom:0.75px solid #ccc\">Tiling weights<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;vertical-align:top;border-bottom:0.75px solid #ccc\">Must not exceed 32kg/m² on tape and jointed systems, or 20kg/m² on skimmed systems.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"width:38%;padding:3px 7px 3px 0;vertical-align:top;border-bottom:0.75px solid #ccc\">Maximum heights<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;vertical-align:top;border-bottom:0.75px solid #ccc\">Assessed in the cold state. Notify GA Interiors Ltd. if project requirements change.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"width:38%;padding:3px 7px 3px 0;vertical-align:top\">Additional notes<\u002Fsc-raw-td><sc-raw-td style=\"padding:3px 0;vertical-align:top\"><span class=\"fill\">[Any notes specific to this system.]<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rail\" style=\"display:flex;justify-content:flex-start;margin-top:18px\">\n    <button class=\"rail\" type=\"button\" sc-camel-on-click=\"{{ addClause }}\" style=\"appearance:none;border:1px solid #000;background:#000;color:#fff;font:600 9pt/1.2 Archivo,Helvetica,Arial,sans-serif;padding:8px 12px;cursor:pointer;white-space:nowrap\" style-hover=\"background:#333;border-color:#333\">+ Add clause<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showGuidance }}\" hint-placeholder-val=\"{{ true }}\">\n<section class=\"rail\" data-tabpane=\"setup\" style=\"font-family:Archivo,Helvetica,Arial,sans-serif;color:#000;margin-top:30px;padding-top:22px;border-top:3px double #000\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid #000;padding-bottom:6px\">\n    <h2 style=\"font-size:15pt;font-weight:700;margin:0;letter-spacing:-0.01em\">How to use this template<\u002Fh2>\n    <span style=\"font-size:8pt;text-transform:uppercase;letter-spacing:0.1em;color:#555\">Internal — not printed<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"columns:2;column-gap:34px;font-size:9.5pt;line-height:1.6;padding-top:12px\">\n    <ol style=\"margin:0;padding-left:18px\">\n      <li style=\"margin-bottom:8px\">Start on the <strong>Project setup<\u002Fstrong> page: fill in the specification title, issuing company, project number, name, address, revision, date, contractor, sub-contractor, architect and GA contact, then press <strong>Apply to specification<\u002Fstrong>. Those values flow into the title page, running header and clauses and are saved with the document.<\u002Fli>\n      <li style=\"margin-bottom:8px\">Choose the manufacturer and board range on the same page. Only these two fields need changing to re-issue a specification against a different manufacturer; check any board names that differ between ranges (dB, Fire, MR, Standard, Coreboard equivalents).<\u002Fli>\n      <li style=\"margin-bottom:8px\">Use <strong>Choose a system from the library<\u002Fstrong> to pick a tested manufacturer system: set the schedule, narrow by family, filter on performance (for example “60 minutes” or “54 dB”), give it your project reference, then press <strong>Insert into schedule<\u002Fstrong> — the row lands in the matching table on tab 3. Anything not in the library goes in as a <strong>custom system<\u002Fstrong> below, which is saved for future projects.<\u002Fli>\n      <li style=\"margin-bottom:8px\">Complete the three schedule tables. Duplicate a row per type, use a full-width row for types removed from the specification, and put project comments in each table’s <strong>Additional notes<\u002Fstrong> row.<\u002Fli>\n      <li style=\"margin-bottom:8px\">Press <strong>Generate full clauses from schedule<\u002Fstrong> to build one clause page per scheduled type. Anything the schedule cannot supply reads TBC — complete those by hand.<\u002Fli>\n      <li style=\"margin-bottom:8px\">Use <strong>+ Add clause<\u002Fstrong> at the end of the clause section for anything extra, <strong>− Remove clause<\u002Fstrong> in a clause header to delete one, and <strong>Undo remove<\u002Fstrong> if that was a mistake.<\u002Fli>\n      <li style=\"margin-bottom:8px\">Drop or paste an image into each clause’s build-up box (hover the box and press Ctrl+V). Double-click a filled box to move and resize the image.<\u002Fli>\n      <li style=\"margin-bottom:8px\">Add a row to the title-page revision table for every issue, and update the revision letter and date on the setup page.<\u002Fli>\n      <li style=\"margin-bottom:0px\">Press <strong>Save as new project<\u002Fstrong> at the top to create a fresh copy for the next job — each copy keeps its own images and project details. Export with <strong>Print / save PDF<\u002Fstrong> at A4 landscape; this page and all buttons are omitted from the print.<\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<\u002Fdoc-page>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;manufacturer&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[Manufacturer]&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Boards&quot;},&quot;boardRange&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[Board range]&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Boards&quot;},&quot;companyName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;GA Interiors Ltd.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Issuer&quot;},&quot;specBrand&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[SPEC BRAND]&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Issuer&quot;},&quot;projectName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[Project name, Address, Town]&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Project&quot;},&quot;docRef&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[BPD000000]&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Project&quot;},&quot;revision&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Project&quot;},&quot;issueDate&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[00.00.0000]&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Project&quot;},&quot;showGuidance&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Project&quot;}}\">\nclass Component extends DCLogic {\n  state = { status: \"Creates a copy of this page in the project, with its own images.\" };\n  async _saveCopy() {\n    const name = window.prompt(\"Project name for the new copy:\");\n    if (!name) return;\n    const safe = name.replace(/[^\\w \\-&.]/g, \"\").replace(/\\s+/g, \" \").trim();\n    if (!safe) { this.setState({ status: \"That name can't be used.\" }); return; }\n    const write = this._hostWrite();\n    if (!write) { this.setState({ status: \"Use “New K10” in the Cloud bar to start a fresh specification here.\" }); return; }\n    this.setState({ status: \"Saving…\" });\n    try {\n      const src = await fetch(location.href.split(\"#\")[0].split(\"?\")[0]).then((r) => r.text());\n      const dest = safe + \" — K10 Specification.dc.html\";\n      await write(dest, src);\n      // Flush anything still pending so the copy carries the current state.\n      clearTimeout(this._saveTimer);\n      await this._saveContent();\n      const here = this._docBase();\n      const there = dest.replace(/\\.dc\\.html$/i, \"\");\n      // Sidecars: dropped images, project setup, and the schedule rows and\n      // clauses that live outside the template — so the copy opens complete\n      // and stays independently editable.\n      const sidecars = [\".image-slots.state.json\", \".k10-setup.json\", \".k10-content.json\"];\n      for (const ext of sidecars) {\n        const text = await fetch(here + ext).then((r) => (r.ok ? r.text() : null)).catch(() => null);\n        if (text) await write(there + ext, text);\n      }\n      this.setState({ status: \"Created “\" + dest + \"” with its setup, schedules, clauses and images. Open it from the file list and keep working there.\" });\n    } catch (e) {\n      this.setState({ status: \"Could not save: \" + (e && e.message ? e.message : e) });\n    }\n  }\n  _addClause() {\n    const proforma = document.querySelector(\"[data-clause-proforma]\");\n    if (!proforma) return;\n    const clone = proforma.cloneNode(true);\n    clone.removeAttribute(\"data-clause-proforma\");\n    clone.setAttribute(\"data-clause-added\", \"\");\n    const stamp = Date.now().toString(36);\n    clone.querySelectorAll(\"image-slot\").forEach((slot, i) => {\n      slot.id = \"clause-\" + stamp + \"-\" + i;\n      slot.removeAttribute(\"data-editable\");\n    });\n    const tag = clone.querySelector(\"[data-clause-tag]\");\n    if (tag) tag.textContent = \"New clause — complete and rename\";\n    this._addRemoveControl(clone);\n    const added = document.querySelectorAll(\"[data-clause-added]\");\n    const last = added.length ? added[added.length - 1] : proforma;\n    last.parentNode.insertBefore(clone, last.nextSibling);\n    clone.setAttribute(\"tabindex\", \"-1\");\n  }\n\n  _clauseNote(msg) {\n    const el = document.getElementById(\"clause-remove-status\");\n    if (el) el.textContent = msg;\n  }\n\n  componentDidMount() {\n    this._decorateClauses();\n    this._initTabs();\n    this._makeEditable();\n    [\"keydown\", \"input\", \"change\", \"paste\", \"drop\"].forEach((evt) => {\n      document.addEventListener(evt, () => { this._userTouched = true; }, true);\n    });\n    document.addEventListener(\"click\", (e) => {\n      if (e.target.closest && e.target.closest(\"button\")) this._userTouched = true;\n    }, true);\n    const snapshot = () => {\n      const blank = this._collectContent();\n      this._contentBaseline = this._normalise({ s: blank.sched, c: blank.clauses, f: blank.fills });\n    };\n    snapshot();\n    // image-slot stamps its own attributes when it upgrades; re-take the\n    // baseline once that has settled so it can never read as an edit.\n    const slots = window.customElements && customElements.whenDefined(\"image-slot\");\n    if (slots) slots.then(() => requestAnimationFrame(() => requestAnimationFrame(snapshot)));\n    this._initLock().then((unlocked) => {\n      this._loadSetup();\n      if (unlocked) this._initCloud();\n    });\n  }\n\n  _initTabs() {\n    document.querySelectorAll(\"[data-tab]\").forEach((b) => {\n      b.addEventListener(\"click\", () => this._showTab(b.getAttribute(\"data-tab\")));\n    });\n    this._showTab(this._tab || \"setup\");\n  }\n\n  // Setup is a working tab only; front page and K10 are the printed output.\n  _showTab(name) {\n    this._tab = name;\n    document.querySelectorAll(\"[data-tabpane]\").forEach((el) => {\n      // Capture the authored display once — clearing it would drop flex covers.\n      if (el.dataset.paneDisplay == null) el.dataset.paneDisplay = el.style.display || \"\";\n      el.style.display = el.getAttribute(\"data-tabpane\") === name ? el.dataset.paneDisplay : \"none\";\n    });\n    // The running header/footer belong to the issued document, not the working sheet.\n    document.querySelectorAll('[slot=\"header\"],[slot=\"footer\"]').forEach((el) => {\n      el.style.display = name === \"setup\" ? \"none\" : \"\";\n    });\n    document.querySelectorAll(\"[data-tab]\").forEach((b) => {\n      const on = b.getAttribute(\"data-tab\") === name;\n      b.style.background = on ? \"#000\" : \"#fff\";\n      b.style.color = on ? \"#fff\" : \"#000\";\n    });\n  }\n\n  _printDoc() {\n    document.querySelectorAll(\"[data-tabpane]\").forEach((el) => {\n      if (el.dataset.paneDisplay == null) el.dataset.paneDisplay = el.style.display || \"\";\n      el.style.display = el.getAttribute(\"data-tabpane\") === \"setup\" ? \"none\" : el.dataset.paneDisplay;\n    });\n    document.querySelectorAll('[slot=\"header\"],[slot=\"footer\"]').forEach((el) => { el.style.display = \"\"; });\n    const restore = () => { this._showTab(this._tab || \"setup\"); window.removeEventListener(\"afterprint\", restore); };\n    window.addEventListener(\"afterprint\", restore);\n    setTimeout(() => { window.print(); setTimeout(restore, 800); }, 120);\n  }\n\n  _docBase() {\n    return decodeURIComponent(location.pathname.split(\"/\").pop() || \"\").replace(/\\.dc\\.html$/i, \"\");\n  }\n\n  // Project setup lives with this document; the system library is shared by\n  // every project so it grows into one reference set.\n  _setupFile() { return this._docBase() + \".k10-setup.json\"; }\n  // Imported manufacturer catalogue (read-only) and this office's own additions.\n  _libraryFile() { return \"k10-system-library.json\"; }\n  _customFile() { return \"k10-custom-systems.json\"; }\n  // Rows inserted into the schedules and clauses generated or added after the\n  // template was authored live only in the page, so they are saved beside it.\n  // Clause images look after themselves — imag a - b);\n    const fireOptions = uniqSorted(inKind.map((r) => this._fireMins(r)))\n      .map((n) => ({ value: String(n), label: n + \" minutes\" }));\n    const rwVals = uniqSorted(inKind.map((r) => this._rw(r)));\n    const acousticOptions = rwVals.map((n) => ({ value: String(n), label: n + \" dB Rw or better\" }));\n    const htVals = uniqSorted(inKind.map((r) => this._maxHeight(r)));\n    const heightOptions = htVals.map((n) => ({ value: String(n), label: n + \"mm or higher\" }));\n    const boards = [];\n    inKind.forEach((r) => this._boardNames(r).forEach((b) => { if (boards.indexOf(b) === -1) boards.push(b); }));\n    const boardOptions = boards.sort().map((b) => ({ value: b, label: b }));\n    const matches = this._matches(pickState);\n    const chosen = catalog.find((r) => r.id === pickState.id) || matches[0];\n    // Compact fire notation for the picker only — the schedule keeps the full wording.\n    const fireShort = (v) => (v || \"\").replace(/\\s*minutes\\s*tested to\\s*/i, \" to \").replace(/BS\\s*EN\\s*/gi, \"BSEN \");\n    const summarise = (r) => r ? [r.family + \" \" + r.ref, r.systemType, fireShort(r.fire), r.acoustic, r.duty, r.height,\n      r.width, r.boards, r.insulation].filter(Boolean).join(\"  ·  \") : \"No system selected.\";\n    // Blank performance means not published — say so rather than leaving a gap.\n    const np = \"Not published\";\n    const pickRows = chosen ? [\n      { label: \"System\", value: [chosen.family, chosen.ref].filter(Boolean).join(\"  ·  \") },\n      { label: \"Type\", value: chosen.systemType || np },\n      { label: \"Fire\", value: chosen.fire || np },\n      { label: \"Acoustic\", value: chosen.acoustic || np },\n      { label: kind === \"steel\" ? \"Section factor\" : \"Duty\", value: (kind === \"steel\" ? chosen.factor : chosen.duty) || np },\n      { label: kind === \"ceiling\" ? \"Max suspension\" : \"Max height\", value: chosen.height || np },\n      { label: kind === \"wall\" ? \"Stud / framing\" : \"Framing\", value: [chosen.framing, chosen.track, chosen.resilientBars, chosen.hanger].filter(Boolean).join(\"; \") || np },\n      { label: \"Boards\", value: !chosen.boards ? np\n        : /^\\s*\\d+(\\.\\d+)?mm\\s*$/.test(chosen.boards) ? chosen.boards + \" — board type not published for this system\"\n        : chosen.boards },\n      { label: \"Insulation\", value: chosen.insulation || np },\n      { label: kind === \"ceiling\" ? \"Plenum\" : \"Overall width\", value: chosen.width || np },\n      { label: \"Weight\", value: chosen.weight || np }\n    ] : [{ label: \"System\", value: \"No system selected.\" }];\n    const library = (this.state.library || []).map((e) => ({\n      title: [e.ref, e.sysRef].filter(Boolean).join(\"  ·  \"),\n      summary: [e.manufacturer, e.systemType || e.member, e.acoustic, e.fire, e.height || e.h600,\n        e.clause ? \"Full clause held (\" + Object.keys(e.clause).length + \" fields)\" : \"\",\n        (e.projects && e.projects.length) ? \"Used on: \" + e.projects.map((p) => p.project).join(\"; \") : \"\",\n        e.updated ? \"Last updated \" + e.updated : \"\"]\n        .filter(Boolean).join(\" · \") || \"No performance data recorded\",\n      insert: () => this._insertRow(e),\n      remove: () => this._removeCode(e.id)\n    }));\n    return {\n      status: this.state.status,\n      setupStatus: this.state.setupStatus || \"Nothing applied yet.\",\n      libraryStatus: this.state.libraryStatus || \"\",\n      library: library,\n      libraryCount: library.length + (library.length === 1 ? \" entry\" : \" entries\"),\n      catalogCount: catalog.length ? catalog.length + \" systems imported\" : \"Library not loaded\",\n      familyOptions: families.map((f) => ({ value: f, label: f })),\n      fireOptions: fireOptions,\n      boardOptions: boardOptions,\n      acousticOptions: acousticOptions,\n      heightOptions: heightOptions,\n      showAcoustic: kind === \"wall\" && acousticOptions.length > 0,\n      showHeight: kind === \"wall\" && heightOptions.length > 0,\n      pickOptions: matches.slice(0, 400).map((r) => ({\n        value: r.id,\n        label: [r.ref, r.systemType, fireShort(r.fire), r.acoustic, r.height].filter(Boolean).join(\"  ·  \")\n      })),\n      matchCount: matches.length + (matches.length === 1 ? \" match\" : \" matches\"),\n      pickSummary: summarise(chosen),\n      pickRows: pickRows,\n      pickStatus: this.state.pickStatus || \"Inserts a row into the matching schedule table on tab 3.\",\n      onPick: () => this.setState({ pick: this._pickVals(), pickStatus: \"\" }),\n      insertPick: () => this._insertPick(),\n      captureSchedules: () => this._captureSchedules(false),\n      saveCopy: () => this._saveCopy(),\n      addClause: () => this._addClause(),\n      generateClauses: () => this._generateClauses(),\n      undoRemoveClause: () => this._undoRemoveClause(),\n      applySetup: () => this._applySetup(),\n      saveCode: () => this._saveCode(),\n      printDoc: () => this._printDoc(),\n      companyName: pick(\"companyName\", \"GA Interiors Ltd.\"),\n      specBrand: pick(\"specBrand\", \"GA Technical Specification\"),\n      manufacturer: pick(\"manufacturer\", \"[Manufacturer]\"),\n      boardRange: pick(\"boardRange\", \"[Board range]\"),\n      projectName: pick(\"projectName\", \"[Project name]\"),\n      projectAddress: pick(\"projectAddress\", \"[Address, Town, Postcode]\"),\n      mainContractor: pick(\"mainContractor\", \"[Main contractor]\"),\n      subContractor: pick(\"subContractor\", \"[Drylining sub-contractor]\"),\n      architect: pick(\"architect\", \"[Architect]\"),\n      issuedBy: pick(\"issuedBy\", \"Samuel Dann — Head of Design & Technical\"),\n      issuedByTel: pick(\"issuedByTel\", \"07594 131593\"),\n      issuedByEmail: pick(\"issuedByEmail\", \"samuel@gainteriorsltd.com\"),\n      docRef: sv.projectNumber || p.docRef || \"[BPD000000]\",\n      revision: pick(\"revision\", \"A\"),\n      issueDate: pick(\"issueDate\", this._today()),\n      showGuidance: p.showGuidance ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
